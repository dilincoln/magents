<template>
	<!-- bars 68–76: the same TUI by keys and by clicks, then the window bows out -->
	<div data-hf-id="hf-jwgc" data-composition-id="input" data-width="1920" data-height="1080" data-duration="14.545">
		<div data-hf-id="hf-d1uq" class="halo"></div>
		<div data-hf-id="hf-ix6b" class="window main">
			<div data-hf-id="hf-ufsv" class="bar"><i data-hf-id="hf-wt6k"></i><i data-hf-id="hf-zeb8"></i><i data-hf-id="hf-y7e5"></i><span data-hf-id="hf-sibq">magents — demo@devbox: ~/code/atlas-api</span></div>
			<div data-hf-id="hf-2t3w" class="body">
				<div data-hf-id="hf-v901" id="h-input" class="host clip" data-composition-id="h-input" data-no-timeline
					data-start="0" data-duration="14.545" data-playback-start="0.908"></div>
				<!-- the pointer, drawn where the recorded clicks landed -->
				<svg data-hf-id="hf-vi41" id="pointer" viewBox="0 0 24 24" width="34" height="34"><path data-hf-id="hf-vp49" d="M3 2 L3 20 L8 15.5 L11.5 22.5 L14.5 21 L11 14 L18 14 Z" fill="#fff" stroke="#05060b" stroke-width="1.6" stroke-linejoin="round" /></svg>
				<div data-hf-id="hf-l3gf" id="ripple"></div>
				<div data-hf-id="hf-r3h8" class="glint"></div>
			</div>
		</div>
		<div data-hf-id="hf-2mgg" class="cap">
			<div data-hf-id="hf-hi8v" class="kicker">09 · Keyboard &amp; mouse</div>
			<h2 data-hf-id="hf-l2f6">Keys or clicks. Your call.</h2>
			<p data-hf-id="hf-wmd8">Every action has a key and a click — move, fold a group, pick a session, open a panel. Selecting text copies it, over ssh too.</p>
			<div data-hf-id="hf-rgbw" class="keys"><kbd data-hf-id="hf-z0du">j</kbd><kbd data-hf-id="hf-ym2t">k</kbd><kbd data-hf-id="hf-l4nc">⌃e</kbd><span data-hf-id="hf-6by2">or just click</span></div>
		</div>
		<!-- the keys pressed, shown under the window as they happen -->
		<div data-hf-id="hf-vq8x" id="keyhud"></div>
		<script>
			(function () {
				const s = Film.feature("input", Film.bar(68), { take: "input" });
				const { tl } = s;
				const input = s.hosts["h-input"];
				const pointer = s.q("#pointer");
				const ripple = s.q("#ripple");

				// the clicks: a pointer travelling to where each one landed
				const cell = (x, y) => ({ x: x * 12 + 6, y: y * 25 + 12 });
				const tip = ({ x, y }) => ({ x: x - 5, y: y - 4 }); // the arrow's point, not its box
				const mice = input.take.events.filter((e) => e.kind !== "key");
				let last = { x: 1100, y: 640 };
				tl.set(pointer, tip(last), 0);
				tl.fromTo(pointer, { opacity: 0 }, { opacity: 1, duration: 0.3 }, input.clock(mice[0].t) - 1.0);
				for (const e of mice) {
					const at = input.clock(e.t);
					const to = cell(e.x, e.y);
					// arrive just as the click lands
					const travel = Math.min(0.6, Math.max(0.25, Math.hypot(to.x - last.x, to.y - last.y) / 1400));
					tl.fromTo(pointer, tip(last), { ...tip(to), duration: travel, ease: "power2.inOut" }, at - travel);
					tl.fromTo(ripple, { ...to, scale: 0.3, opacity: 0.9 }, { scale: 1.3, opacity: 0, duration: 0.45, ease: "power2.out" }, at);
					last = to;
					if (e.kind === "drag") {
						const end = cell(e.x1, e.y);
						tl.fromTo(pointer, tip(to), { ...tip(end), duration: e.ms / 1000, ease: "none" }, at);
						last = end;
					}
				}
				tl.to(pointer, { opacity: 0, duration: 0.3 }, s.bar(76) - 0.6);

				// the keys: a keycap each, as it is pressed
				for (const e of input.take.events.filter((e) => e.kind === "key")) {
					const cap = document.createElement("kbd");
					cap.textContent = e.label;
					s.q("#keyhud").appendChild(cap);
					const at = input.clock(e.t);
					tl.set(cap, { xPercent: -50 }, 0);
					tl.fromTo(cap, { opacity: 0, y: 18, scale: 0.85 }, { opacity: 1, y: 0, scale: 1, duration: 0.18, ease: "back.out(2)" }, at - 0.04);
					tl.to(cap, { opacity: 0, y: -10, duration: 0.25, ease: "power2.in" }, at + 0.5);
				}

				// the recap is next: the window bows out by the scene's end
				tl.to(s.q(".window.main"), { x: 960 - 840 * 0.5, y: 540 - 492 * 0.5, scale: 0.5, opacity: 0, duration: 0.5, ease: "power3.in" }, s.bar(76) - 0.5);
				tl.to(s.q(".halo"), { opacity: 0, duration: 0.4 }, s.bar(76) - 0.4);
				s.done();
			})();
		</script>
	</div>
</template>
